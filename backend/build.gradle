plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.greenhouse'
version = '0.1.0'
description = 'API para control de fiado - Green House'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Solo nos interesa el jar ejecutable de Spring Boot (bootJar); sin esto
// Gradle también genera un -plain.jar que complica copiar "el jar" al
// construir la imagen Docker para el despliegue.
tasks.named('jar') {
    enabled = false
}

// Asegura los nombres de parámetros disponibles vía reflection (los necesita
// Spring para @RequestParam/@PathVariable sin nombre explícito). Gradle ya lo
// hace por defecto en proyectos Spring Boot, pero lo dejamos explícito porque
// otros compiladores (ej. el de VS Code) no siempre lo aplican.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

// Carga variables de entorno desde .env (si existe) para que bootRun no
// requiera setearlas a mano en cada sesión de terminal.
def envFile = file('.env')
if (envFile.exists()) {
    def dotenv = [:]
    envFile.eachLine { line ->
        line = line.trim()
        if (line && !line.startsWith('#') && line.contains('=')) {
            def (key, value) = line.split('=', 2)
            dotenv[key.trim()] = value.trim()
        }
    }
    tasks.named('bootRun') {
        environment(dotenv)
    }
}
