spring.application.name=greenhouse-backend
# Render (y la mayoría de hosts gratuitos) asignan el puerto vía la variable
# de entorno PORT; localmente cae al 8080 de siempre.
server.port=${PORT:8080}

# --- PostgreSQL ---
# Todo se lee de variables de entorno, con un default local para que funcione
# sin configurar nada si tenés Postgres corriendo en tu máquina.
# Para usar Neon (u otra base online), definí las 3 variables de entorno
# DB_URL, DB_USERNAME y DB_PASSWORD -- ver instrucciones en el README.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/greenhouse_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP (pool de conexiones) ---
# Neon (el host es el "pooler" de Neon, basado en PgBouncer) puede cerrar
# conexiones inactivas en silencio. Si Hikari no se entera y la app trata
# de usar una conexión que ya está muerta del otro lado, la consulta se
# queda esperando en vez de fallar rápido -- eso es lo que se siente como
# que la app "se queda pegada" al guardar un cliente o una transacción, y
# por qué pasa solo "a veces" (justo cuando la conexión que tocó ya estaba
# vieja). max-lifetime más corto que el timeout del pooler de Neon obliga
# a Hikari a renovar las conexiones antes de que Neon las mate; keepalive
# las mantiene vivas con un ping periódico en vez de dejarlas inactivas.
spring.datasource.hikari.max-lifetime=170000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT (cambiar el secret en producción, min 256 bits) ---
# También se puede sobreescribir con la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:cambiar_este_secreto_por_uno_largo_y_seguro_de_al_menos_32_caracteres}
jwt.expiration-ms=86400000

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Email (Resend, para recuperación de contraseña) ---
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
