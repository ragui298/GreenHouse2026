<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M18 3C18 3 8 9 8 19C8 25.5 12.5 30 18 30C23.5 30 28 25.5 28 19C28 9 18 3 18 3Z" stroke="#E8A33D" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M18 30V16" stroke="#E8A33D" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Green House</span>
    </div>

    <nav class="nav">
      @for (item of itemsVisibles(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-link"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path [attr.d]="item.icono"/>
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <span class="user-name">{{ nombreUsuario() }}</span>
        <span class="user-perfil">&#64;{{ username() }}</span>
      </div>
      <button class="btn-logout" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
