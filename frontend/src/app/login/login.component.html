<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <svg class="brand-mark" width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M18 3C18 3 8 9 8 19C8 25.5 12.5 30 18 30C23.5 30 28 25.5 28 19C28 9 18 3 18 3Z" stroke="#2F5233" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M18 30V16" stroke="#2F5233" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M18 21C18 21 13 20 13 15" stroke="#4C7A57" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M18 24C18 24 23 22.5 23 17" stroke="#4C7A57" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div>
        <h1 class="brand-name">Green House</h1>
        <p class="brand-tagline">Libro de fiado</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="admin"
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input
            id="password"
            [type]="mostrarPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="toggleMostrarPassword()"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (mostrarPassword()) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-10-8-10-8a18.36 18.36 0 0 1 4.22-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <path d="M1 1l22 22"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      @if (error()) {
        <p class="error-message" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
      </button>

      <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </form>
  </div>
</div>
